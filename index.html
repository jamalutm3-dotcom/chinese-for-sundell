<!doctype html><html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1220"><link rel="manifest" href="manifest.json">
<title>Chinese for Sundell — Full HSK 1</title>
<style>
:root{--bg:#f4f7fb;--card:#fff;--ink:#0f172a;--muted:#64748b;--line:#e2e8f0;--dark:#0b1220;--blue:#2563eb}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI","Noto Sans SC",sans-serif}
header{background:linear-gradient(135deg,#0b1220,#1e293b);color:#fff;padding:19px 16px 16px;position:sticky;top:0;z-index:20}h1{font-size:22px;margin:0}.sub{font-size:12px;color:#cbd5e1;margin-top:4px}
nav{display:flex;gap:7px;overflow:auto;background:#fff;padding:8px;position:sticky;top:70px;z-index:19;border-bottom:1px solid var(--line)}nav button{border:0;background:#f1f5f9;color:#334155;border-radius:999px;padding:9px 12px;font-weight:750;white-space:nowrap}nav button.on{background:var(--dark);color:#fff}
main{max-width:820px;margin:auto;padding:13px 12px 70px}.card{background:var(--card);border:1px solid var(--line);border-radius:17px;padding:15px;margin:10px 0;box-shadow:0 4px 18px #0f172a0b}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.stat{background:#f8fafc;border-radius:14px;padding:13px}.big{font-size:26px;font-weight:850}.muted{color:var(--muted);font-size:13px}
.tag{display:inline-block;background:#eff6ff;color:#1d4ed8;border-radius:999px;padding:4px 8px;font-size:11px;font-weight:800}.progress{height:9px;background:#e2e8f0;border-radius:99px;overflow:hidden}.bar{height:100%;background:var(--blue)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.between{display:flex;justify-content:space-between;align-items:center;gap:10px}
.primary,.secondary{border-radius:11px;padding:10px 13px;font-weight:750;cursor:pointer}.primary{border:0;background:var(--dark);color:#fff}.secondary{border:1px solid #cbd5e1;background:#fff;color:#172033}
.zh{font-size:30px;font-weight:850;margin-top:8px}.py{font-size:16px;color:#64748b}.mypron{font-size:14px;color:#0f766e;margin-top:4px}.en{margin-top:5px}.item{background:#fff;border:1px solid var(--line);border-radius:14px;padding:13px;margin:8px 0}.list{display:grid;gap:7px}
input,select{width:100%;padding:11px;border:1px solid #cbd5e1;border-radius:11px;font-size:15px;background:#fff}.quiz{display:block;width:100%;text-align:left;margin:8px 0;padding:13px;border:1px solid #cbd5e1;border-radius:12px;background:#fff;font-size:15px;cursor:pointer}
.good{background:#f0fdf4!important;border-color:#16a34a!important}.bad{background:#fef2f2!important;border-color:#dc2626!important}.center{text-align:center}.score{font-size:40px;font-weight:900}.mic{font-size:28px;padding:15px 18px;border-radius:50%;border:0;background:#0b1220;color:#fff;cursor:pointer}.transcript{min-height:48px;padding:12px;background:#f8fafc;border-radius:12px;margin:10px 0}
footer{text-align:center;color:#94a3b8;font-size:11px;padding:18px}.timer{font-size:20px;font-weight:850}
@media(max-width:520px){.grid3{grid-template-columns:1fr 1fr}.zh{font-size:27px}}
</style></head><body>
<header><h1>🇨🇳 Chinese for Sundell</h1><div class="sub">30-Day HSK 1 Exam + Speaking + Listening + PCB Conversation</div></header>
<nav id="nav"></nav><main id="app"></main><footer>Personal learning tool · Original practice questions · Progress saved on this device</footer>
<script src="data.js"></script><script>
const D=APP_DATA,KEY="sundell_full_v3";let S=JSON.parse(localStorage.getItem(KEY)||"null")||{master:{},days:[],listen:0,speak:0,xp:0,mocks:[],rate:.82};
const T=[["home","Home"],["exam","🎯 HSK 1"],["days","📅 30 Days"],["speak","🗣️ Speaking"],["listen","🎧 Listening"],["conversation","💬 Conversation"],["pcb","🏭 PCB"],["progress","📊 Progress"]];
function save(){localStorage.setItem(KEY,JSON.stringify(S))}function go(x){location.hash=x;render()}function nav(){let c=(location.hash||"#home").slice(1);document.getElementById("nav").innerHTML=T.map(x=>`<button class="${c==x[0]?"on":""}" onclick="go('${x[0]}')">${x[1]}</button>`).join("")}
function speakCN(t){if(!("speechSynthesis"in window))return alert("Speech is not supported.");speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang="zh-CN";u.rate=Number(S.rate);speechSynthesis.speak(u)}
function norm(x){return String(x||"").replace(/[，。！？、,.!?；;:“”"'‘’\s]/g,"").toLowerCase()}
function render(){nav();({home,exam,days,speak,listen,conversation,pcb,progress}[(location.hash||"#home").slice(1)]||home)()}
function mastered(){return Object.keys(S.master).length}
function home(){let pct=Math.round(mastered()/150*100),d=Math.min(30,Math.max(1,S.days.length+1));document.getElementById("app").innerHTML=`
<div class="card"><span class="tag">30-DAY INTENSIVE</span><h2>Day ${d} / 30</h2><p><b>Main goal:</b> HSK 1 exam. <b>Second:</b> speak and understand simple Chinese. <b>After:</b> PCB/Sundell Chinese.</p><div class="progress"><div class="bar" style="width:${pct}%"></div></div><p class="muted">${mastered()}/150 words mastered · ${S.xp} XP</p></div>
<div class="grid3"><div class="stat"><div class="muted">HSK</div><div class="big">${mastered()}/150</div></div><div class="stat"><div class="muted">Listening</div><div class="big">${S.listen}</div></div><div class="stat"><div class="muted">Speaking</div><div class="big">${S.speak}</div></div></div>
<div class="card"><h3>Today's 60-minute routine</h3><div class="list"><div class="item"><b>20 min</b> 📚 HSK vocabulary + examples</div><div class="item"><b>15 min</b> 🎧 Listening</div><div class="item"><b>10 min</b> 🗣️ Speaking</div><div class="item"><b>15 min</b> 📝 Exam practice / review</div></div></div>
<div class="card"><h3>Quick start</h3><div class="row"><button class="primary" onclick="go('days')">Today's lesson</button><button class="primary" onclick="go('listen')">Listening</button><button class="primary" onclick="go('speak')">Speaking</button><button class="secondary" onclick="mock()">Full mock</button></div></div>
<div class="card"><h3>🏭 Factory survival</h3>${D.factory.slice(0,4).map(factoryCard).join("")}</div>
<div class="card"><h3>Voice speed</h3><input type="range" min=".55" max="1.05" step=".03" value="${S.rate}" oninput="S.rate=this.value;save()"></div>`}
function factoryCard(x){return `<div class="item"><div class="zh">${x.zh}</div><div class="py">${x.py}</div><div class="mypron">🇲🇾 Malay sound: <b>${x.my}</b></div><div>${x.en}</div><button class="secondary" onclick='speakCN(${JSON.stringify(x.zh)})'>🔊 Listen</button></div>`}
function exam(){document.getElementById("app").innerHTML=`
<div class="card"><span class="tag">EXAM TRACK</span><h2>HSK 1 — exam first</h2><p>The current Chinese Tests Service page describes HSK 1 as <b>40 questions: 20 listening + 20 reading</b>, about <b>35 minutes</b>, with <b>120/200</b> as the passing total. HSK 1 is based on 150 basic words and grammar patterns.</p><p class="muted">Speaking is a separate training track because the written HSK 1 exam is listening + reading. We still train speaking for your real-life goal.</p></div>
<div class="grid"><div class="card"><h3>📚 Vocabulary</h3><p>All 150 words, categories, examples and audio.</p><button class="primary" onclick="vocab()">Study</button></div><div class="card"><h3>📝 Practice</h3><p>Original HSK-style questions.</p><button class="primary" onclick="practice()">Practice</button></div><div class="card"><h3>🎧 Listening</h3><p>Listen and choose.</p><button class="primary" onclick="listen(true)">Drill</button></div><div class="card"><h3>🏆 Mock</h3><p>40 questions · timed.</p><button class="primary" onclick="mock()">Start</button></div></div>`}
function vocab(){document.getElementById("app").innerHTML=`<div class="card"><div class="between"><h2>HSK 1 · 150 words</h2><p class="muted">Pinyin + 🇲🇾 Malay-style pronunciation guide</p><button class="secondary" onclick="exam()">Back</button></div><select id="cat" onchange="filterV()"><option value="">All categories</option>${[...new Set(D.hsk.map(x=>x.cat))].map(c=>`<option>${c}</option>`).join("")}</select><input id="vq" placeholder="Search Chinese / pinyin / English" oninput="filterV()"></div><div id="vl" class="list"></div>`;filterV()}
function filterV(){let q=(document.getElementById("vq").value||"").toLowerCase(),c=document.getElementById("cat").value;let a=D.hsk.filter(x=>(!c||x.cat==c)&&x.zh.concat(x.py,x.en).toLowerCase().includes(q));document.getElementById("vl").innerHTML=a.map(x=>{let i=D.hsk.indexOf(x),m=S.master[i],e=D.examples[x.zh]||[x.zh+"。",x.py,x.en];return `<div class="item"><div class="between"><span class="tag">${x.cat}</span><span class="muted">${m?"✓ Mastered":"New"}</span></div><div class="zh">${x.zh}</div><div class="py">${x.py}</div><div class="mypron">🇲🇾 Malay sound: <b>${x.my}</b></div><div>${x.en}</div><div class="row"><button class="secondary" onclick='speakCN(${JSON.stringify(x.zh)})'>🔊</button><button class="secondary" onclick="mark(${i})">${m?"Mastered":"+ Master"}</button><button class="secondary" onclick='speakCN(${JSON.stringify(e[0])})'>Example</button></div><div class="muted">${e[0]} · ${e[1]} · ${e[2]}</div></div>`}).join("")}
function mark(i){if(!S.master[i]){S.master[i]=1;S.xp+=2;save()}vocab()}
function days(){let d=Math.min(30,Math.max(1,S.days.length+1)),start=(d-1)*5,ws=D.order.slice(start,start+5);document.getElementById("app").innerHTML=`<div class="card"><span class="tag">DAY ${d}/30</span><h2>Today's 5-word lesson</h2><p>Learn → hear → speak the examples → mark mastered.</p></div>${ws.map(w=>{let x=D.hsk.find(y=>y.zh==w),i=D.hsk.indexOf(x),e=D.examples[w]||[w+"。",x.py,x.en];return `<div class="item"><div class="zh">${w}</div><div class="py">${x.py}</div><div class="mypron">🇲🇾 Malay sound: <b>${x.my}</b></div><div>${x.en}</div><div class="row"><button class="secondary" onclick='speakCN(${JSON.stringify(w)})'>🔊 Word</button><button class="secondary" onclick='speakCN(${JSON.stringify(e[0])})'>🔊 Example</button><button class="secondary" onclick="markDayWord(${i})">${S.master[i]?"✓ Mastered":"+ Master"}</button></div><div class="muted">${e[0]} · ${e[1]} · ${e[2]}</div></div>`}).join("")}<div class="card"><button class="primary" onclick="finishDay(${d})">✓ Complete Day ${d}</button><button class="secondary" onclick="vocab()">Browse all words</button></div>`}
function markDayWord(i){if(!S.master[i]){S.master[i]=1;S.xp+=2;save()}days()}
function finishDay(n){if(!S.days.includes(n)){S.days.push(n);S.xp+=10;save()}days()}
function practice(){let q=makeQ();document.getElementById("app").innerHTML=`<div class="card"><span class="tag">HSK PRACTICE</span><h2>${q.prompt}</h2>${q.body}<div id="qr"></div></div>`}
function makeQ(){let x=D.hsk[Math.floor(Math.random()*D.hsk.length)],o=[x,...D.hsk.filter(y=>y!==x).sort(()=>Math.random()-.5).slice(0,3)].sort(()=>Math.random()-.5);return{prompt:`What does ${x.zh} mean?`,body:o.map(y=>`<button class="quiz" onclick='pick(this,${JSON.stringify(y.en)},${JSON.stringify(x.en)})'>${y.en}</button>`).join("")}}
function pick(el,g,c){if(document.getElementById("qr").dataset.done)return;document.getElementById("qr").dataset.done=1;let ok=g==c;el.classList.add(ok?"good":"bad");document.querySelectorAll(".quiz").forEach(b=>{if(b.textContent==c)b.classList.add("good")});S.xp+=ok?5:1;save();document.getElementById("qr").innerHTML=`<h3>${ok?"✅ Correct":"❌ Review"}</h3><p>${c}</p><button class="primary" onclick="practice()">Next</button>`}
let LEX=false;function listen(examMode=false){LEX=examMode;let q=makeLQ();document.getElementById("app").innerHTML=`<div class="card center"><span class="tag">${examMode?"HSK LISTENING":"LISTENING LAB"}</span><h2>Listen and choose</h2><button class="primary" onclick='speakCN(${JSON.stringify(q.audio)})'>🔊 Play Chinese</button><p class="muted">First listen without looking at pinyin.</p>${q.opts.map(o=>`<button class="quiz" onclick='lpick(this,${JSON.stringify(o)},${JSON.stringify(q.answer)})'>${o}</button>`).join("")}<div id="lr"></div></div>`}
function makeLQ(){let x=D.hsk[Math.floor(Math.random()*D.hsk.length)],o=[x,...D.hsk.filter(y=>y!==x).sort(()=>Math.random()-.5).slice(0,3)].map(y=>y.en).sort(()=>Math.random()-.5);return{audio:x.zh,answer:x.en,opts:o}}
function lpick(el,g,c){if(document.getElementById("lr").dataset.done)return;document.getElementById("lr").dataset.done=1;let ok=g==c;el.classList.add(ok?"good":"bad");document.querySelectorAll(".quiz").forEach(b=>{if(b.textContent==c)b.classList.add("good")});S.listen++;S.xp+=ok?5:1;save();document.getElementById("lr").innerHTML=`<h3>${ok?"✅ Correct":"❌ Review"}</h3><p>${c}</p><button class="primary" onclick="listen(${LEX})">Next</button>`}
let SR=null,target="";function speak(){let p=[["你叫什么名字？","Nǐ jiào shénme míngzi?","What is your name?","我叫Jamal。"],["你做什么工作？","Nǐ zuò shénme gōngzuò?","What work do you do?","我是工程师。"],["你喜欢喝茶吗？","Nǐ xǐhuan hē chá ma?","Do you like tea?","我喜欢喝茶。"],["你今天忙吗？","Nǐ jīntiān máng ma?","Are you busy today?","今天很忙。"],["你去哪儿？","Nǐ qù nǎr?","Where are you going?","我去工厂。"]][Math.floor(Math.random()*5)];target=p[3];document.getElementById("app").innerHTML=`<div class="card center"><span class="tag">SPEAKING LAB</span><h2>${p[0]}</h2><div class="py">${p[1]}</div><div>${p[2]}</div><button class="secondary" onclick='speakCN(${JSON.stringify(p[0])})'>🔊 Hear question</button><hr><p><b>Your answer:</b></p><div class="zh">${target}</div><button class="mic" onclick="startSpeech()">🎙️</button><div id="tr" class="transcript">Tap the microphone and speak Chinese.</div><div id="sr"></div></div>`}
function startSpeech(){if(!("webkitSpeechRecognition"in window||"SpeechRecognition"in window)){document.getElementById("sr").innerHTML="<p>Speech recognition is unavailable here. Use 🔊 Hear and repeat aloud.</p>";return}let R=window.SpeechRecognition||window.webkitSpeechRecognition;SR=new R();SR.lang="zh-CN";SR.interimResults=false;SR.maxAlternatives=3;SR.onresult=e=>{let text=e.results[0][0].transcript;document.getElementById("tr").textContent=text;let ok=norm(text)==norm(target)||norm(text).includes(norm(target))||norm(target).includes(norm(text));S.speak++;S.xp+=ok?8:2;save();document.getElementById("sr").innerHTML=`<h3>${ok?"✅ Good match":"🟡 Try again"}</h3><p>Target: ${target}</p><button class="primary" onclick="speak()">Next</button>`};SR.onerror=()=>document.getElementById("sr").innerHTML="<p>Speech recognition had a problem. Try again or use repeat mode.</p>";SR.start()}
function conversation(){let c=D.convos[Math.floor(Math.random()*D.convos.length)],t=c.turns[0];window.CT=t;document.getElementById("app").innerHTML=`<div class="card"><span class="tag">CONVERSATION</span><h2>${c.title}</h2><div class="item"><div class="zh">${t.q}</div><div class="py">${t.qpy}</div><div>${t.qen}</div><button class="secondary" onclick='speakCN(${JSON.stringify(t.q)})'>🔊 Hear</button></div><button class="primary" onclick="reveal()">Show model answer</button><div id="ca"></div></div>`}
function reveal(){let t=window.CT;document.getElementById("ca").innerHTML=`<div class="item"><div class="zh">${t.a}</div><div class="py">${t.apy}</div><div>${t.aen}</div><button class="secondary" onclick='speakCN(${JSON.stringify(t.a)})'>🔊 Hear</button></div><button class="primary" onclick="speak()">Practice speaking</button>`}
function pcb(){document.getElementById("app").innerHTML=`<div class="card"><span class="tag">SECOND TRACK</span><h2>🏭 PCB / Sundell Chinese</h2><p>Use this after your daily HSK work.</p><input id="pq" placeholder="Search PCB term" oninput="fp()"></div><div id="pl" class="list"></div><div class="card"><h3>Factory phrases</h3>${D.factory.map(factoryCard).join("")}</div>`;fp()}
function fp(){let q=(document.getElementById("pq").value||"").toLowerCase();document.getElementById("pl").innerHTML=D.pcb.filter(x=>x.zh.concat(x.py,x.en).toLowerCase().includes(q)).map(x=>`<div class="item"><div class="zh">${x.zh}</div><div class="py">${x.py}</div><div class="mypron">🇲🇾 Malay sound: <b>${x.my}</b></div><div>${x.en}</div><button class="secondary" onclick='speakCN(${JSON.stringify(x.zh)})'>🔊</button></div>`).join("")}
let MT=null,mi=0,ml=0,mr=0,timeLeft=35*60,timer=null;function mock(){MT=[];for(let i=0;i<40;i++){let x=D.hsk[Math.floor(Math.random()*D.hsk.length)],o=[x,...D.hsk.filter(y=>y!==x).sort(()=>Math.random()-.5).slice(0,3)].sort(()=>Math.random()-.5);MT.push({x,opts:o,listen:i<20})}mi=0;ml=0;mr=0;timeLeft=35*60;clearInterval(timer);timer=setInterval(()=>{timeLeft--;if(timeLeft<=0){clearInterval(timer);mi=40;showMock()}},1000);showMock()}
function showMock(){if(mi>=40){clearInterval(timer);let l=Math.round(ml/20*100),r=Math.round(mr/20*100),score=l+r;S.mocks.push({l,r,score,date:new Date().toLocaleDateString()});save();document.getElementById("app").innerHTML=`<div class="card center"><span class="tag">MOCK COMPLETE</span><div class="score">${score}/200</div><h2>${score>=120?"🎉 PASS TARGET":"🟡 Keep training"}</h2><p>Listening ${l}/100 · Reading ${r}/100</p><p>${score>=120?"Good. Repeat later to make the pass reliable.":"Official passing target: 120/200."}</p><button class="primary" onclick="mock()">Another mock</button></div>`;return}let q=MT[mi],mins=String(Math.floor(timeLeft/60)).padStart(2,"0"),secs=String(timeLeft%60).padStart(2,"0");document.getElementById("app").innerHTML=`<div class="card"><div class="between"><span class="tag">${q.listen?"🎧 Listening":"📖 Reading"} · ${mi+1}/40</span><span class="timer">${mins}:${secs}</span></div><h2>${q.listen?"Listen and choose the meaning":"Choose the correct meaning"}</h2>${q.listen?`<button class="primary" onclick='speakCN(${JSON.stringify(q.x.zh)})'>🔊 Play</button>`:`<div class="zh">${q.x.zh}</div><div class="py">${q.x.py}</div>`}${q.opts.map(o=>`<button class="quiz" onclick='mpick(this,${JSON.stringify(o.en)},${JSON.stringify(q.x.en)})'>${o.en}</button>`).join("")}<p class="muted">Original practice simulation — not an official past paper.</p></div>`}
function mpick(el,g,c){if(el.dataset.done)return;el.dataset.done=1;let ok=g==c;el.classList.add(ok?"good":"bad");if(ok){if(MT[mi].listen)ml++;else mr++}document.querySelectorAll(".quiz").forEach(b=>{if(b.textContent==c)b.classList.add("good")});setTimeout(()=>{mi++;showMock()},450)}
function progress(){let pct=Math.round(mastered()/150*100),last=S.mocks.at(-1);document.getElementById("app").innerHTML=`<div class="card"><h2>📊 Progress</h2><div class="progress"><div class="bar" style="width:${pct}%"></div></div><h3>${pct}% vocabulary mastered</h3><p>${mastered()}/150</p></div><div class="grid3"><div class="stat"><div class="muted">Listening</div><div class="big">${S.listen}</div></div><div class="stat"><div class="muted">Speaking</div><div class="big">${S.speak}</div></div><div class="stat"><div class="muted">Mocks</div><div class="big">${S.mocks.length}</div></div></div><div class="card"><h3>Latest mock</h3>${last?`<div class="score">${last.score}/200</div><p>Listening ${last.l}/100 · Reading ${last.r}/100 · ${last.score>=120?"PASS TARGET":"below target"}</p>`:"No mock yet."}</div><div class="card"><h3>30-day checklist</h3>${Array.from({length:30},(_,i)=>`<div class="item between"><div><b>Day ${i+1}</b><div class="muted">5 HSK words + listening + speaking + practice</div></div><button class="secondary" onclick="finishDay(${i+1})">${S.days.includes(i+1)?"✓ Done":"Complete"}</button></div>`).join("")}</div>`}
window.vocab=vocab;window.practice=practice;window.listen=listen;window.speak=speak;window.conversation=conversation;window.pcb=pcb;window.progress=progress;window.exam=exam;window.days=days;window.mock=mock;window.finishDay=finishDay;
addEventListener("hashchange",render);render();
</script></body></html>
