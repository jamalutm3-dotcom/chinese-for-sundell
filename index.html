["品质","Pǐnzhì","Quality"],["品质工程师","Pǐnzhì gōngchéngshī","Quality engineer"],["客户","Kèhù","Customer"],["生产线","Shēngchǎnxiàn","Production line"],["批次","Pīcì","Lot/batch"],["物料","Wùliào","Material"],["不良","Bùliáng","Defect/NG"],["问题","Wèntí","Problem"],["原因","Yuányīn","Cause"],["根本原因","Gēnběn yuányīn","Root cause"],["对策","Duìcè","Countermeasure"],["改善","Gǎishàn","Improvement"],["确认","Quèrèn","Confirm"],["检查","Jiǎnchá","Inspect/check"],["测量","Cèliáng","Measure"],["尺寸","Chǐcùn","Dimension"],["规格","Guīgé","Specification"],["标准","Biāozhǔn","Standard"],["超出规格","Chāochū guīgé","Out of specification"],["合格","Hégé","Pass"],["不合格","Bù hégé","Fail"],["返工","Fǎngōng","Rework"],["报废","Bàofèi","Scrap"],["隔离","Gélí","Quarantine"],["放行","Fàngxíng","Release"],["抽检","Chōujiǎn","Sampling inspection"],["全检","Quánjiǎn","100% inspection"],["报告","Bàogào","Report"],["数据","Shùjù","Data"],["结果","Jiéguǒ","Result"],["样品","Yàngpǐn","Sample"],["分析","Fēnxī","Analysis"],["验证","Yànzhèng","Verification"],["停线","Tíngxiàn","Stop the line"],["更新","Gēngxīn","Update"],["状态","Zhuàngtài","Status"],["跟进","Gēnjìn","Follow up"],["钻孔","Zuānkǒng","Drilling"],["压合","Yāhé","Lamination/press"],["镭射","Léishè","Laser"],["电镀","Diàndù","Plating"],["铜箔","Tóngbó","Copper foil"],["孔","Kǒng","Hole"],["厚度","Hòudù","Thickness"],["良率","Liánglǜ","Yield"],["不良率","Bùliánglǜ","Defect rate"],["刮伤","Guāshāng","Scratch"],["污染","Wūrǎn","Contamination"],["破损","Pòsǔn","Damage"],["短路","Duǎnlù","Short circuit"],["开路","Kāilù","Open circuit"],["客户投诉","Kèhù tóusù","Customer complaint"],["临时措施","Línshí cuòshī","Containment action"],["长期对策","Chángqī duìcè","Long-term countermeasure"],["会议","Huìyì","Meeting"],["主管","Zhǔguǎn","Supervisor/manager"],["工程师","Gōngchéngshī","Engineer"]
];
const F=[
["你好，我是Jamal。","Nǐ hǎo, wǒ shì Jamal.","Hello, I am Jamal."],["我负责品质。","Wǒ fùzé pǐnzhì.","I am responsible for quality."],
["请再说一次。","Qǐng zài shuō yí cì.","Please say it again."],["请说慢一点。","Qǐng shuō màn yìdiǎn.","Please speak a little slower."],
["我听不懂。","Wǒ tīng bù dǒng.","I don't understand."],["我先确认一下。","Wǒ xiān quèrèn yíxià.","I'll check first."],

["这个尺寸超出规格。","Zhège chǐcùn chāochū guīgé.","This dimension is out of specification."],["这个结果合格。","Zhège jiéguǒ hégé.","This result passes."],

["验证结果出来了吗？","Yànzhèng jiéguǒ chūlái le ma?","Is the verification result out?"],["我会跟进。","Wǒ huì gēnjìn.","I will follow up."],

const K="sundell_web_v2";let S=JSON.parse(localStorage.getItem(K)||"null")||{xp:0,h:{},p:{},days:[],rate:.85};
const tabs=[["home","Home"],["hsk","HSK 1"],["pcb","PCB"],["phrases","Phrases"],["quiz","Quiz"],["plan","30 Days"]];
function save(){localStorage.setItem(K,JSON.stringify(S))}
function speak(t){if(!("speechSynthesis"in window))return alert("Speech is not supported.");speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang="zh-CN";u.rate=+S.rate;speechSynthesis.speak(u)}
function go(x){location.hash=x;render()}function nav(){let c=(location.hash||"#home").slice(1);document.getElementById("nav").innerHTML=tabs.map(x=>`<button class="${c==x[0]?"a":""}" onclick="go('${x[0]}')">${x[1]}</button>`).join("")}
function render(){nav();({home,hsk,pcb,phrases,quiz,plan}[(location.hash||"#home").slice(1)]||home)()}
function home(){let h=Object.keys(S.h).length,p=Object.keys(S.p).length;document.getElementById("app").innerHTML=`
<div class="card"><span class="tag">Day ${Math.min(30,Math.floor(S.xp/40)+1)} / 30</span><h2>Today's mission</h2><p>20–30 minutes: <b>Learn → Listen → Speak → Quiz.</b></p><div class="progress"><div class="bar" style="width:${Math.min(100,S.xp/12)}%"></div></div><p class="muted">${S.xp} XP</p></div>
<div class="grid"><div class="stat"><div class="muted">HSK learned</div><div class="big">${h}/150</div></div><div class="stat"><div class="muted">PCB learned</div><div class="big">${p}/${P.length}</div></div></div>
<div class="card"><h3>Start</h3><div class="row"><button class="primary" onclick="go('hsk')">HSK 1</button><button class="primary" onclick="go('pcb')">PCB Chinese</button><button class="secondary" onclick="go('quiz')">Quiz</button></div></div>
<div class="card"><h3>🏭 Factory Survival</h3>${F.slice(0,5).map(card).join("")}</div>
<div class="card"><h3>🔊 Pronunciation speed</h3><input type="range" min=".6" max="1.2" step=".05" value="${S.rate}" oninput="S.rate=this.value;save()"></div>`}
function card(x){return `<div class="item"><div class="zh">${x[0]}</div><div class="py">${x[1]}</div><div class="en">${x[2]}</div><button class="secondary" onclick='speak(${JSON.stringify(x[0])})'>🔊 Listen</button></div>`}
function list(arr,type,title){document.getElementById("app").innerHTML=`<div class="card"><h2>${title}</h2><input id="q" placeholder="Search Chinese / pinyin / English" oninput="filter()"></div><div id="list" class="list"></div>`;window.A=arr;window.T=type;filter()}
function filter(){let q=(document.getElementById("q").value||"").toLowerCase();document.getElementById("list").innerHTML=A.filter(x=>x.join(" ").toLowerCase().includes(q)).map((x,i)=>{let d=(T=="h"?S.h:S.p)[i];return `<div class="item"><span class="tag">${d?"✓ Learned":"New"}</span><div class="zh">${x[0]}</div><div class="py">${x[1]}</div><div class="en">${x[2]}</div><div class="row"><button class="secondary" onclick='speak(${JSON.stringify(x[0])})'>🔊</button><button class="secondary" onclick="learn(${i})">${d?"Learned":"+ Learn"}</button></div></div>`}).join("")}
function learn(i){let o=T=="h"?S.h:S.p;if(!o[i]){o[i]=1;S.xp+=2;save()}render()}
function hsk(){list(H,"h","HSK 1 · Core Vocabulary")}function pcb(){list(P,"p","PCB Factory Vocabulary")}
function phrases(){document.getElementById("app").innerHTML=`<div class="card"><h2>Factory Phrases</h2><p class="muted">Repeat each sentence aloud 3 times.</p></div><div class="list">${F.map(card).join("")}</div>`}
let C=null,done=false;function quiz(){C=H[Math.floor(Math.random()*H.length)];done=false;let O=[C,...H.filter(x=>x!==C).sort(()=>Math.random()-.5).slice(0,3)].sort(()=>Math.random()-.5);document.getElementById("app").innerHTML=`<div class="card"><span class="tag">HSK 1 Quiz</span><h2>What does this mean?</h2><div class="zh">${C[0]}</div><div class="py">${C[1]}</div><button class="secondary" onclick='speak(${JSON.stringify(C[0])})'>🔊 Listen</button>${O.map(x=>`<button class="quiz" onclick='ans(this,${JSON.stringify(x[2])},${JSON.stringify(C[2])})'>${x[2]}</button>`).join("")}<div id="r"></div></div>`}
function ans(el,g,c){if(done)return;done=true;let ok=g==c;el.classList.add(ok?"good":"bad");document.querySelectorAll(".quiz").forEach(x=>{if(x.textContent==c)x.classList.add("good")});S.xp+=ok?5:1;save();document.getElementById("r").innerHTML=`<h3>${ok?"✅ Correct!":"❌ Review this one"}</h3><p>${c}</p><button class="primary" onclick="quiz()">Next</button>`}
function plan(){document.getElementById("app").innerHTML=`<div class="card"><h2>📅 30-Day Plan</h2><p>Short daily sessions. Focus on HSK first, then factory communication.</p></div><div class="list">${Array.from({length:30},(_,i)=>`<div class="item day"><div><b>Day ${i+1}</b><div class="muted">${i<10?"Pinyin + HSK basics":"HSK review + PCB communication"}</div><div class="muted">HSK target ${Math.min(150,(i+1)*5)} · PCB ${Math.min(P.length,Math.max(0,(i-1)*2))}</div></div><button class="secondary" onclick="finish(${i+1})">${S.days.includes(i+1)?"✓ Done":"Complete"}</button></div>`).join("")}</div>`}
function finish(n){if(!S.days.includes(n)){S.days.push(n);S.xp+=10;save();render()}}addEventListener("hashchange",render);render();
</script></body></html>
