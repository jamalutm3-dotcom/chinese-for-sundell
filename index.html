<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b1220"><link rel="manifest" href="manifest.json"><title>Chinese for Sundell</title><style>
*{box-sizing:border-box}body{margin:0;background:#f4f7fb;color:#0f172a;font-family:system-ui,-apple-system,"Segoe UI","Noto Sans SC",sans-serif}header{background:#0b1220;color:#fff;padding:18px;position:sticky;top:0;z-index:5}h1{margin:0;font-size:22px}.sub{font-size:12px;color:#cbd5e1}nav{display:flex;gap:7px;overflow:auto;background:#fff;padding:8px;position:sticky;top:65px;z-index:4;border-bottom:1px solid #e2e8f0}nav button,.pill{border:0;padding:9px 12px;border-radius:99px;font-weight:800;white-space:nowrap}.on{background:#0b1220!important;color:#fff}.tab{display:flex;gap:8px;overflow:auto;margin:8px 0}.tab button{border:1px solid #cbd5e1;background:#fff;padding:10px 13px;border-radius:12px;font-weight:800}.tab .sel{background:#2563eb;color:#fff;border-color:#2563eb}main{max-width:900px;margin:auto;padding:12px 12px 70px}.card,.item{background:#fff;border:1px solid #e2e8f0;border-radius:16px;padding:15px;margin:10px 0}.hero{background:linear-gradient(135deg,#0b1220,#334155);color:#fff;border:0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.tag{display:inline-block;padding:4px 8px;border-radius:99px;background:#eff6ff;color:#1d4ed8;font-size:11px;font-weight:900}.btn{padding:10px 13px;border-radius:11px;border:1px solid #cbd5e1;background:#fff;font-weight:800;cursor:pointer}.primary{background:#0b1220;color:#fff;border-color:#0b1220}.blue{background:#2563eb;color:#fff;border-color:#2563eb}.green{background:#16a34a;color:#fff;border-color:#16a34a}.muted{color:#64748b;font-size:13px}.zh{font-size:29px;font-weight:900}.py{color:#64748b}.my{color:#0f766e;font-size:14px}.q{display:block;width:100%;text-align:left;margin:8px 0;padding:13px;border:1px solid #cbd5e1;border-radius:11px;background:#fff;font-size:15px;cursor:pointer}.good{background:#dcfce7!important;border-color:#16a34a!important}.bad{background:#fee2e2!important;border-color:#dc2626!important}.score{font-size:46px;font-weight:950;text-align:center}.big{font-size:62px;text-align:center}.xp{font-weight:900}.barbg{height:10px;background:#e2e8f0;border-radius:99px;overflow:hidden}.bar{height:100%;background:#2563eb;border-radius:99px}.between{display:flex;justify-content:space-between;gap:10px;align-items:center}.row{display:flex;gap:8px;flex-wrap:wrap}.streak{font-size:14px}.lock{opacity:.55}.choice{font-size:18px}.mini{font-size:12px;color:#64748b}.gamecard{min-height:180px}.reward{font-size:30px;text-align:center}.danger{color:#b91c1c}@media(max-width:650px){.grid{grid-template-columns:1fr}}
</style></head><body><header><h1>🇨🇳 Chinese for Sundell</h1><div class="sub">Learn → Play → Remember → Level Up</div></header><nav id="nav"></nav><main id="app"></main><script src="data.js"></script><script>
const D=APP_DATA,KEY='sundell_gamified_v2';let S=JSON.parse(localStorage.getItem(KEY)||'null')||{h:{level:0,xp:0,streak:0,days:[],mistakes:[]},s:{level:0,xp:0,streak:0,days:[],mistakes:[]},exam:{master:{},listen:0,read:0,mocks:[]}};function save(){localStorage.setItem(KEY,JSON.stringify(S))}function audio(t){speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='zh-CN';u.rate=.82;speechSynthesis.speak(u)}function go(x){location.hash=x;render()}const routes=[['home','🏠 Home'],['hsk','🎯 HSK 1'],['sundell','🏭 Sundell'],['study','📚 Study'],['games','🎮 Games'],['progress','📊 Progress']];function nav(){let r=(location.hash||'#home').slice(1);navEl.innerHTML=routes.map(x=>`<button class="${r==x[0]?'on':''}" onclick="go('${x[0]}')">${x[1]}</button>`).join('')}const navEl=document.getElementById('nav'),app=document.getElementById('app');addEventListener('hashchange',render);
function levelData(track){let a=track==='h'?D.hsk:D.factory;let n=10;let max=Math.ceil(a.length/n);return{a,n,max}}function words(track){let z=levelData(track),lv=S[track].level;return z.a.slice(lv*z.n,(lv+1)*z.n)}function title(track){return track==='h'?'HSK 1':'Sundell'}function home(){app.innerHTML=`<div class="card hero"><h2>🎮 Learn → Play → Remember</h2><p><b>Study</b> teaches a small chunk. <b>Game</b> immediately uses only that chunk. Pass the level, unlock the next one.</p><div class="row"><span>🎯 HSK 1 = exam</span><span>🏭 Sundell = workplace</span></div></div><div class="grid"><div class="card"><span class="tag">EXAM TRACK</span><h2>🎯 HSK 1</h2><p>${S.h.level+1}/${levelData('h').max} learning levels unlocked</p><button class="btn primary" onclick="go('hsk')">Enter HSK</button></div><div class="card"><span class="tag">WORK TRACK</span><h2>🏭 Sundell</h2><p>${S.s.level+1}/${levelData('s').max} workplace levels unlocked</p><button class="btn primary" onclick="go('sundell')">Enter Sundell</button></div></div><div class="card"><div class="between"><b>🔥 Streak</b><b>⚡ HSK ${S.h.xp} XP · Sundell ${S.s.xp} XP</b></div><p class="muted">Small daily wins. No cramming required.</p></div>`}
function track(track){let z=levelData(track),cur=S[track].level,kind=track==='h'?'HSK 1':'Sundell';app.innerHTML=`<div class="card hero"><span class="tag">${track==='h'?'EXAM':'WORKPLACE'}</span><h2>${track==='h'?'🎯 HSK 1':'🏭 Sundell'} — ${kind}</h2><p>Each level = <b>10 new words/phrases</b>. Study them first. Then the game uses only those 10.</p><div class="tab"><button class="sel" onclick="study('${track}')">📚 Study</button><button onclick="game('${track}')">🎮 Game</button>${track==='h'?'<button onclick="examCenter()">📝 Exam</button>':''}</div></div><div class="card"><div class="between"><h3>Level ${cur+1} / ${z.max}</h3><span class="pill">⚡ ${S[track].xp} XP</span></div><p>${cur<z.max?`Learn 10 ${track==='h'?'HSK words':'workplace phrases'} → play → unlock Level ${cur+2}.`:'🏆 All current levels completed!'}</p><div class="barbg"><div class="bar" style="width:${Math.min(100,Math.round((cur/z.max)*100))}%"></div></div></div><div class="grid"><div class="card"><h3>📚 Study</h3><p>See, hear and say the current 10.</p><button class="btn blue" onclick="study('${track}')">Start Study</button></div><div class="card"><h3>🎮 Game</h3><p>Random questions from only these 10.</p><button class="btn primary" onclick="game('${track}')">Start Game</button></div></div>`}
function study(track){let w=words(track),cur=S[track].level;app.innerHTML=`<div class="card"><div class="between"><h2>📚 Level ${cur+1} Study</h2><span>10 items</span></div><p class="muted">Don't memorize everything at once. Hear → look → say → move on.</p></div>${w.map((x,i)=>{let zh=x.zh||x.q,en=x.en||x.qen,py=x.py||x.qpy,my=x.my||'';return `<div class="item"><span class="tag">${i+1}/10</span><div class="zh">${zh}</div><div class="py">${py||''}</div><div class="my">🇲🇾 ${my}</div><div>${en}</div><button class="btn" onclick='audio(${JSON.stringify(zh)})'>🔊 Hear</button></div>`}).join('')}<div class="card"><button class="btn primary" onclick="game('${track}')">🎮 I learned these → Play Game</button></div>`}
function optionsFor(track,current){let w=words(track);return [current,...w.filter(x=>x!==current).sort(()=>Math.random()-.5).slice(0,3)].sort(()=>Math.random()-.5)}
let G={track:'h',score:0,total:0,answered:0,questions:[]};function game(track){let w=words(track);if(!w.length){app.innerHTML='<div class="card"><h2>🏆 Complete!</h2></div>';return}G={track,score:0,total:10,answered:0,questions:[]};for(let i=0;i<10;i++){let x=w[Math.floor(Math.random()*w.length)],type=i%4;G.questions.push({x,type})}gameQ()}
function gameQ(){let q=G.questions[G.answered],x=q.x,track=G.track,opts=optionsFor(track,x),zh=x.zh||x.q,en=x.en||x.qen,py=x.py||x.qpy;let body='';if(q.type===0)body=`<div class="big">${zh}</div><p>What does it mean?</p>${opts.map(o=>`<button class="q choice" onclick='gans(this,${JSON.stringify(o.en||o.qen)},${JSON.stringify(en)})'>${o.en||o.qen}</button>`).join('')}`;else if(q.type===1)body=`<p>Listen and choose the Chinese.</p><button class="btn blue" onclick='audio(${JSON.stringify(zh)})'>🔊 Play</button>${opts.map(o=>`<button class="q choice" onclick='gans(this,${JSON.stringify(o.zh||o.q)},${JSON.stringify(zh)})'>${o.zh||o.q}</button>`).join('')}`;else if(q.type===2)body=`<div class="zh">${zh}</div><div class="py">${py}</div><p>🇲🇾 Which sound helps you remember it?</p>${opts.map(o=>`<button class="q choice" onclick='gans(this,${JSON.stringify(o.my||o.py||o.qpy)},${JSON.stringify(x.my||x.py||x.qpy)})'>🇲🇾 ${o.my||o.py||o.qpy}</button>`).join('')}`;else body=`<p>Complete the meaning:</p><div class="zh">${zh}</div><p><b>${en}</b></p><p>Choose the matching Chinese.</p>${opts.map(o=>`<button class="q choice" onclick='gans(this,${JSON.stringify(o.zh||o.q)},${JSON.stringify(zh)})'>${o.zh||o.q}</button>`).join('')}`;app.innerHTML=`<div class="card hero"><div class="between"><b>🎮 LEVEL ${S[track].level+1} GAME</b><b>${G.answered+1}/10</b></div><div class="barbg"><div class="bar" style="width:${G.answered/10*100}%"></div></div></div><div class="card gamecard">${body}<div id="res"></div></div>`}
function gans(el,g,c){if(el.dataset.done)return;el.dataset.done=1;let ok=g===c;if(ok)G.score++;el.classList.add(ok?'good':'bad');if(!ok)S[G.track].mistakes.push({level:S[G.track].level,correct:c});setTimeout(()=>{G.answered++;if(G.answered>=10)finishGame();else gameQ()},450)}
function finishGame(){let p=G.score*10,Sx=S[G.track];Sx.xp+=G.score*10;let passed=G.score>=8;if(passed){Sx.level=Math.min(Sx.level+1,levelData(G.track).max)}save();app.innerHTML=`<div class="card"><div class="reward">${passed?'🏆 🔓 🎉':'💪 🔁'}</div><div class="score">${G.score}/10</div><h2 style="text-align:center">${passed?'Level cleared!':'Almost! Play again'}</h2><p style="text-align:center">${passed?'You unlocked the next 10-word set.':'You need 8/10 to unlock the next level. Your mistakes are saved for review.'}</p><div class="row" style="justify-content:center"><button class="btn primary" onclick="game('${G.track}')">🎮 Play Again</button><button class="btn" onclick="study('${G.track}')">📚 Review 10</button>${passed?`<button class="btn green" onclick="study('${G.track}')">➡️ Next Level</button>`:''}</div></div>`}

function studyHub(){let track=location.hash.includes('sundell')?'s':'h';app.innerHTML=`<div class="card hero"><h2>📚 Study Hub</h2><p>Choose what you want to study. Your existing HSK and Sundell sections remain unchanged.</p><div class="row"><button class="btn ${track==='h'?'blue':' '}" onclick="go('study-hsk')">🎯 HSK 1 Study</button><button class="btn ${track==='s'?'blue':' '}" onclick="go('study-sundell')">🏭 Sundell Study</button></div></div><div class="card"><h3>${track==='h'?'🎯 HSK 1':'🏭 Sundell'} — Study Levels</h3><p>Learn <b>10 items at a time</b>, hear them, see the Malay pronunciation, understand the meaning, then move to the game.</p><button class="btn primary" onclick="study('${track}')">📖 Start Level ${S[track].level+1}</button></div>`}
function gameHub(){let track=location.hash.includes('sundell')?'s':'h';app.innerHTML=`<div class="card hero"><h2>🎮 Game Hub</h2><p>Short rounds. Random questions. Only words from the current study level.</p><div class="row"><button class="btn ${track==='h'?'blue':' '}" onclick="go('games-hsk')">🎯 HSK 1 Games</button><button class="btn ${track==='s'?'blue':' '}" onclick="go('games-sundell')">🏭 Sundell Games</button></div></div><div class="card"><h3>${track==='h'?'🎯 HSK 1':'🏭 Sundell'} — Level ${S[track].level+1}</h3><p>🎲 10 questions · 🔊 listening · 🧠 recognition · 🇲🇾 Malay pronunciation</p><p>Pass with <b>8/10</b> to unlock the next level.</p><button class="btn primary" onclick="game('${track}')">🎮 Play Level ${S[track].level+1}</button></div>`}
function hsk(){app.innerHTML='';track('h')}function sundell(){app.innerHTML='';track('s')}
function examCenter(){app.innerHTML=`<div class="card hero"><h2>📝 HSK 1 EXAM CENTER</h2><p>This is separate from the level game. Use this when you want exam-style practice.</p></div><div class="grid"><div class="card"><h3>📚 Vocabulary Internal Test</h3><button class="btn primary" onclick="vocabTest()">Start</button></div><div class="card"><h3>🎧 Listening 20Q</h3><button class="btn primary" onclick="section('l')">Start</button></div><div class="card"><h3>📖 Reading 20Q</h3><button class="btn primary" onclick="section('r')">Start</button></div><div class="card"><h3>🏆 Full Mock 40Q</h3><button class="btn primary" onclick="mock()">Start</button></div></div><div class="card"><h3>🔥 Exam Patterns</h3><button class="btn" onclick="freq()">Analyze</button><button class="btn" onclick="patterns()">Grammar</button></div>`}
const P=[['吗','Yes/no question','你是学生吗？','Are you a student?'],['什么','What','你叫什么名字？','What is your name?'],['谁','Who','他是谁？','Who is he?'],['哪儿','Where','你去哪儿？','Where are you going?'],['多少','How much/how many','多少钱？','How much?'],['几','How many','你几岁？','How old are you?'],['有/没有','Have / don’t have','我有钱。','I have money.'],['是','Be','我是学生。','I am a student.'],['在','Location','我在学校。','I am at school.'],['的','Possession','这是我的书。','This is my book.']];function patterns(){app.innerHTML=`<div class="card"><h2>🧩 Grammar & Patterns</h2><p>Recognize the structure first. Then hear and say it.</p></div>${P.map(p=>`<div class="item"><b>${p[0]} — ${p[1]}</b><div class="zh">${p[2]}</div><div>${p[3]}</div><button class="btn" onclick='audio(${JSON.stringify(p[2])})'>🔊</button></div>`).join('')}`}
function freq(){app.innerHTML=`<div class="card"><h2>🔥 HSK Pattern Recognition</h2><p>Train the question shapes you see repeatedly: names, age, family, numbers, time, places, daily actions, yes/no and question words.</p></div>`+P.map(p=>`<div class="item"><b>${p[0]} — ${p[1]}</b><div class="zh">${p[2]}</div><div>${p[3]}</div></div>`).join('')}
function vocabTest(){let x=D.hsk[Math.floor(Math.random()*D.hsk.length)],o=[x,...D.hsk.filter(y=>y!==x).sort(()=>Math.random()-.5).slice(0,3)].sort(()=>Math.random()-.5);app.innerHTML=`<div class="card"><span class="tag">HSK EXAM VOCAB TEST</span><div class="zh">${x.zh}</div><div class="py">${x.py}</div>${o.map(a=>`<button class="q" onclick='exans(this,${JSON.stringify(a.en)},${JSON.stringify(x.en)})'>${a.en}</button>`).join('')}<div id="res"></div></div>`}function exans(el,g,c){if(el.dataset.done)return;el.dataset.done=1;let ok=g===c;el.classList.add(ok?'good':'bad');res.innerHTML=`<h3>${ok?'✅ Correct':'❌ Review'}</h3><p>${c}</p><button class="btn primary" onclick="vocabTest()">Next</button>`}
function section(type){let n=0,score=0;function next(){if(n>=20){app.innerHTML=`<div class="card"><div class="score">${score}/20</div><h2>${score>=12?'🟢 Strong checkpoint':'🟡 Review and retry'}</h2><button class="btn primary" onclick="section('${type}')">Retake</button><button class="btn" onclick="examCenter()">Exam Center</button></div>`;return}let x=D.hsk[Math.floor(Math.random()*D.hsk.length)],o=[x,...D.hsk.filter(y=>y!==x).sort(()=>Math.random()-.5).slice(0,2)].sort(()=>Math.random()-.5);if(type==='l'){app.innerHTML=`<div class="card"><span class="tag">🎧 LISTENING ${n+1}/20</span><button class="btn blue" onclick='audio(${JSON.stringify(x.zh)})'>🔊 Play twice</button>${o.map(a=>`<button class="q" onclick='sa(this,${JSON.stringify(a.en)},${JSON.stringify(x.en)})'>${a.en}</button>`).join('')}<div id="res"></div></div>`}else{app.innerHTML=`<div class="card"><span class="tag">📖 READING ${n+1}/20</span><div class="zh">${x.zh}</div><div class="py">${x.py}</div>${o.map(a=>`<button class="q" onclick='sa(this,${JSON.stringify(a.en)},${JSON.stringify(x.en)})'>${a.en}</button>`).join('')}<div id="res"></div></div>`}}window.sa=(el,g,c)=>{if(el.dataset.done)return;el.dataset.done=1;let ok=g===c;if(ok)score++;el.classList.add(ok?'good':'bad');setTimeout(()=>{n++;next()},250)};next()}
function mock(){section('l')}
function progress(){let h=levelData('h'),s=levelData('s');app.innerHTML=`<div class="card"><h2>📊 Progress</h2><div class="grid"><div><h3>🎯 HSK</h3><p>Level ${S.h.level+1}/${h.max}</p><div class="barbg"><div class="bar" style="width:${S.h.level/h.max*100}%"></div></div><p>⚡ ${S.h.xp} XP</p></div><div><h3>🏭 Sundell</h3><p>Level ${S.s.level+1}/${s.max}</p><div class="barbg"><div class="bar" style="width:${S.s.level/s.max*100}%"></div></div><p>⚡ ${S.s.xp} XP</p></div></div></div><div class="card"><h3>🧠 Mistakes to review</h3><p>HSK: ${S.h.mistakes.length} · Sundell: ${S.s.mistakes.length}</p><button class="btn" onclick="study('h')">Review HSK current level</button> <button class="btn" onclick="study('s')">Review Sundell current level</button></div>`}
render();function render(){nav();let r=(location.hash||'#home').slice(1);if(r==='home')home();else if(r==='hsk')hsk();else if(r==='sundell')sundell();else if(r==='progress')progress();else home()}
</script></body></html>
