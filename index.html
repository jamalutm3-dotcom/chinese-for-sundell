<!doctype html>
<html><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b1220"><link rel="manifest" href="manifest.json">
<title>Chinese for Sundell</title>
<style>
body{margin:0;background:#f4f7fb;color:#0f172a;font-family:system-ui,-apple-system,"Segoe UI","Noto Sans SC",sans-serif}
header{background:#0b1220;color:white;padding:18px;position:sticky;top:0;z-index:5}h1{margin:0;font-size:22px}.sub{font-size:12px;color:#cbd5e1}
nav{display:flex;gap:7px;overflow:auto;background:white;padding:8px;position:sticky;top:65px;z-index:4;border-bottom:1px solid #e2e8f0}nav button{border:0;padding:9px 12px;border-radius:99px;font-weight:800}nav .on{background:#0b1220;color:white}
main{max-width:850px;margin:auto;padding:12px 12px 60px}.card,.item{background:white;border:1px solid #e2e8f0;border-radius:16px;padding:15px;margin:10px 0}.hero{background:linear-gradient(135deg,#0b1220,#334155);color:white;border:0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.tag{display:inline-block;padding:4px 8px;border-radius:99px;background:#eff6ff;color:#1d4ed8;font-size:11px;font-weight:900}.btn{padding:10px 13px;border-radius:11px;border:1px solid #cbd5e1;background:white;font-weight:800}.primary{background:#0b1220;color:white;border-color:#0b1220}.zh{font-size:29px;font-weight:900}.py{color:#64748b}.my{color:#0f766e;font-size:14px}.muted{color:#64748b;font-size:13px}.q{display:block;width:100%;text-align:left;margin:8px 0;padding:13px;border:1px solid #cbd5e1;border-radius:11px;background:white;font-size:15px}.good{background:#dcfce7!important;border-color:#16a34a!important}.bad{background:#fee2e2!important;border-color:#dc2626!important}.picture{font-size:45px;text-align:center}.score{font-size:42px;font-weight:950;text-align:center}.row{display:flex;gap:8px;flex-wrap:wrap}.between{display:flex;justify-content:space-between;gap:10px}.barbg{height:9px;background:#e2e8f0;border-radius:99px}.bar{height:100%;background:#2563eb;border-radius:99px}
@media(max-width:600px){.grid{grid-template-columns:1fr}}
</style></head><body>
<header><h1>🇨🇳 Chinese for Sundell</h1><div class="sub">🎯 HSK 1 Exam Preparation  |  🏭 Sundell Workplace Preparation</div></header>
<nav id="nav"></nav><main id="app"></main>
<script src="data.js"></script><script>
const D=APP_DATA,KEY="sundell_v6";
let S=JSON.parse(localStorage.getItem(KEY)||"null")||{master:{},listen:0,read:0,mocks:[],mini:{v:[],l:[],r:[]},rate:.8};
function save(){localStorage.setItem(KEY,JSON.stringify(S))}
const routes=[["home","🏠 Home"],["hsk","🎯 HSK 1"],["sundell","🏭 Sundell"],["progress","📊 Progress"]];
function nav(){let r=(location.hash||"#home").slice(1);navEl.innerHTML=routes.map(x=>`<button class="${r==x[0]?"on":""}" onclick="go('${x[0]}')">${x[1]}</button>`).join("")}
const navEl=document.getElementById("nav"),app=document.getElementById("app");
function go(x){location.hash=x;render()} addEventListener("hashchange",render);
function audio(t){speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang="zh-CN";u.rate=+S.rate;speechSynthesis.speak(u)}
function render(){nav();let r=(location.hash||"#home").slice(1);({home,hsk,sundell,progress}[r]||home)()}
function home(){app.innerHTML=`<div class="card hero"><h2>Two goals — clearly separated</h2><p><b>🎯 HSK 1</b> = everything for your HSK 1 exam.<br><b>🏭 Sundell</b> = workplace Chinese only.</p></div>
<div class="grid"><div class="card"><span class="tag">TRACK 1</span><h2>🎯 HSK 1 EXAM</h2><p>150 words, grammar, listening, reading, internal tests and full mocks.</p><button class="btn primary" onclick="go('hsk')">Enter HSK 1</button></div>
<div class="card"><span class="tag">TRACK 2</span><h2>🏭 SUNDELL</h2><p>Speaking, listening, PCB, CQE/PQE and factory situations.</p><button class="btn primary" onclick="go('sundell')">Enter Sundell</button></div></div>
<div class="card"><h3>HSK vocabulary</h3><div class="barbg"><div class="bar" style="width:${Math.round(Object.keys(S.master).length/150*100)}%"></div></div><p>${Object.keys(S.master).length}/150 mastered</p></div>`}
function hsk(){app.innerHTML=`<div class="card hero"><span class="tag">HSK ONLY</span><h2>🎯 HSK 1 EXAM CENTER</h2><p>No PCB and no Sundell content here. This track is only for passing HSK 1.</p></div>
<div class="card"><h3>📋 Official target</h3><p><b>40 questions:</b> 20 Listening + 20 Reading. Four listening sections and four reading sections, 5 questions each. About 35 minutes for the test; total 200 points; <b>120+ passes</b>.</p><p class="muted">The official HSK 1 specification describes Listening Parts 1–4 and Reading Parts 1–4; our internal tests below mirror those structures with original questions.</p></div>
<div class="grid">
<div class="card"><h3>📚 Vocabulary</h3><p>150-word syllabus + audio + Malay pronunciation.</p><button class="btn primary" onclick="vocab()">Study + internal test</button></div>
<div class="card"><h3>🧩 Grammar & patterns</h3><p>Learn recurring HSK sentence structures.</p><button class="btn primary" onclick="patterns()">Learn + test</button></div>
<div class="card"><h3>🎧 Listening</h3><p>Parts 1–4 practice + 20-question internal section test.</p><button class="btn primary" onclick="listCenter()">Open</button></div>
<div class="card"><h3>📖 Reading</h3><p>Parts 1–4 practice + 20-question internal section test.</p><button class="btn primary" onclick="readCenter()">Open</button></div>
<div class="card"><h3>🔥 Question patterns</h3><p>High-frequency topics and structures.</p><button class="btn primary" onclick="freq()">Analyze</button></div>
<div class="card"><h3>🏆 Full Mock</h3><p>20 Listening + 20 Reading, timed.</p><button class="btn primary" onclick="mock()">Start</button></div>
</div>`}
const P=[
["吗","Yes/no question","你是学生吗？","Are you a student?"],
["什么","What","你叫什么名字？","What is your name?"],
["谁","Who","他是谁？","Who is he?"],
["哪儿","Where","你去哪儿？","Where are you going?"],
["多少","How much/how many","多少钱？","How much?"],
["几","How many","你几岁？","How old are you?"],
["有/没有","Have / don't have","我有钱。 / 我没有钱。","I have money / I don't have money."],
["是","Be","我是学生。","I am a student."],
["在","Location","我在学校。","I am at school."],
["的","Possession","这是我的书。","This is my book."],
["也","Also","我也是学生。","I am also a student."],
["很","Very","我很好。","I am very well."]
];
function patterns(){app.innerHTML=`<div class="card"><span class="tag">LEARN → THEN TEST</span><h2>🧩 Grammar & Sentence Patterns</h2><p>Recognize the structure first. Then practice variations.</p></div>${P.map(p=>`<div class="item"><b>${p[0]} — ${p[1]}</b><div class="zh">${p[2]}</div><div>${p[3]}</div><button class="btn" onclick='audio(${JSON.stringify(p[2])})'>🔊 Hear</button></div>`).join("")}<button class="btn primary" onclick="patternTest()">Pattern test</button>`}
function patternTest(){let p=P[Math.floor(Math.random()*P.length)],opts=[p[1],...P.filter(x=>x!=p).sort(()=>Math.random()-.5).slice(0,3).map(x=>x[1])].sort(()=>Math.random()-.5);app.innerHTML=`<div class="card"><span class="tag">PATTERN TEST</span><h2>${p[2]}</h2>${opts.map(o=>`<button class="q" onclick='ans(this,${JSON.stringify(o)},${JSON.stringify(p[1])},"patterns")'>${o}</button>`).join("")}<div id="res"></div></div>`}
function ans(el,g,c,type){if(el.dataset.done)return;el.dataset.done=1;let ok=g==c;el.classList.add(ok?"good":"bad");res.innerHTML=`<h3>${ok?"✅ Correct":"❌ Review"}</h3><p>Correct: ${c}</p><button class="btn primary" onclick="${type=="v"?"vocabTest()":"patternTest()"}">Next</button>`}
function vocab(){let q=document.createElement("div");app.innerHTML=`<div class="card"><h2>📚 HSK 1 Vocabulary</h2><p>Chinese → Pinyin → 🇲🇾 Malay sound → meaning → audio. The Malay spelling is a bridge, not a replacement for Pinyin.</p><input id="search" placeholder="Search..." oninput="showV()"><button class="btn primary" onclick="vocabTest()">📝 Internal vocabulary test</button></div><div id="vlist"></div>`;showV()}
function showV(){let q=(search.value||"").toLowerCase();let a=D.hsk.filter(x=>x.zh.concat(x.py,x.en).toLowerCase().includes(q)).slice(0,80);vlist.innerHTML=a.map(x=>{let i=D.hsk.indexOf(x);return `<div class="item"><span class="tag">${x.cat}</span><div class="zh">${x.zh}</div><div class="py">${x.py}</div><div class="my">🇲🇾 Malay sound: <b>${x.my||x.py}</b></div><div>${x.en}</div><button class="btn" onclick='audio(${JSON.stringify(x.zh)})'>🔊</button> <button class="btn" onclick="master(${i})">${S.master[i]?"✓ Mastered":"+ Master"}</button></div>`}).join("")}
function master(i){S.master[i]=1;save();vocab()}
function vocabTest(){let x=D.hsk[Math.floor(Math.random()*D.hsk.length)],opts=[x,...D.hsk.filter(y=>y!=x).sort(()=>Math.random()-.5).slice(0,3)].sort(()=>Math.random()-.5);app.innerHTML=`<div class="card"><span class="tag">VOCABULARY INTERNAL TEST</span><div class="zh">${x.zh}</div><div class="py">${x.py}</div><p>Choose the meaning.</p>${opts.map(o=>`<button class="q" onclick='vans(this,${JSON.stringify(o.en)},${JSON.stringify(x.en)})'>${o.en}</button>`).join("")}<div id="res"></div></div>`}
function vans(el,g,c){if(el.dataset.done)return;el.dataset.done=1;let ok=g==c;el.classList.add(ok?"good":"bad");if(ok)S.master[D.hsk.findIndex(x=>x.en==c)]=1;S.mini.v.push(ok?100:0);save();res.innerHTML=`<h3>${ok?"✅ Correct":"❌ Review"}</h3><p>${c}</p><button class="btn primary" onclick="vocabTest()">Next</button>`}

const LP=["Phrase + picture: judge match","Sentence + 3 pictures: choose the match","Short dialogue + pictures: choose the match","Statement + question + 3 answers"];
function listCenter(){app.innerHTML=`<div class="card"><h2>🎧 HSK 1 Listening Center</h2><p>Each official part has 5 questions and each listening item is played twice.</p></div>${LP.map((x,i)=>`<div class="card"><h3>Part ${i+1}</h3><p>${x}</p><button class="btn primary" onclick="listenPart(${i+1})">Practice Part ${i+1}</button></div>`).join("")}<div class="card"><h3>🎧 20-question Listening Section Test</h3><button class="btn primary" onclick="section('l')">Start internal section test</button></div>`}
function makeL(part){let x=D.hsk[Math.floor(Math.random()*D.hsk.length)],wrong=D.hsk.filter(y=>y!=x).sort(()=>Math.random()-.5).slice(0,2);let opts=[x,...wrong].sort(()=>Math.random()-.5);return{audio:x.zh,answer:x.en,opts:opts.map((z,i)=>({text:z.en,pic:["🍎","🏫","👨"][i]}))}}
function listenPart(part){let q=makeL(part);app.innerHTML=`<div class="card"><span class="tag">LISTENING PART ${part}</span><h2>${LP[part-1]}</h2><button class="btn primary" onclick='audio(${JSON.stringify(q.audio)})'>🔊 Play</button><p class="muted">Play twice before answering.</p><div class="grid">${q.opts.map(o=>`<button class="q picture" onclick='lans(this,${JSON.stringify(o.text)},${JSON.stringify(q.answer)})'>${o.pic}<br><small>${o.text}</small></button>`).join("")}</div><div id="res"></div></div>`}
function lans(el,g,c){if(el.dataset.done)return;el.dataset.done=1;let ok=g==c;el.classList.add(ok?"good":"bad");S.listen++;save();res.innerHTML=`<h3>${ok?"✅ Correct":"❌ Review"}</h3><p>${c}</p><button class="btn primary" onclick="listenPart(1)">Next</button>`}

const RP=["Picture + word: judge match","Sentence + pictures: choose the match","Match question and answer","Fill the blank with the correct word"];
function readCenter(){app.innerHTML=`<div class="card"><h2>📖 HSK 1 Reading Center</h2><p>Four official reading parts × 5 questions. The official test uses pinyin on the paper.</p></div>${RP.map((x,i)=>`<div class="card"><h3>Part ${i+1}</h3><p>${x}</p><button class="btn primary" onclick="readPart(${i+1})">Practice Part ${i+1}</button></div>`).join("")}<div class="card"><h3>📖 20-question Reading Section Test</h3><button class="btn primary" onclick="section('r')">Start internal section test</button></div>`}
function makeR(part){let x=D.hsk[Math.floor(Math.random()*D.hsk.length)];if(part==4)return{title:"Fill the blank",body:"我 ___ 学生。",answer:"是",opts:["是","喝","看"]};if(part==3)return{title:"Match the question",body:"你叫什么名字？",answer:"My name is Jamal.",opts:["My name is Jamal.","I am fine.","Thank you."]};let wrong=D.hsk.filter(y=>y!=x).sort(()=>Math.random()-.5).slice(0,2);return{title:RP[part-1],body:part==1?"🍎<br><b>"+x.zh+"</b>":x.zh+"<br><span class='py'>"+x.py+"</span>",answer:x.en,opts:[x.en,...wrong.map(y=>y.en)]}}
function readPart(part){let q=makeR(part);app.innerHTML=`<div class="card"><span class="tag">READING PART ${part}</span><h2>${q.title}</h2><div class="zh">${q.body}</div>${q.opts.map(o=>`<button class="q" onclick='rans(this,${JSON.stringify(o)},${JSON.stringify(q.answer)})'>${o}</button>`).join("")}<div id="res"></div></div>`}
function rans(el,g,c){if(el.dataset.done)return;el.dataset.done=1;let ok=g==c;el.classList.add(ok?"good":"bad");S.read++;save();res.innerHTML=`<h3>${ok?"✅ Correct":"❌ Review"}</h3><p>Correct: ${c}</p><button class="btn primary" onclick="readPart(4)">Next</button>`}

function section(type){let n=0,score=0;function next(){if(n>=20){let p=Math.round(score/20*100);S.mini[type].push(p);save();app.innerHTML=`<div class="card"><div class="score">${score}/20</div><h2>${p>=60?"🟢 Section target reached":"🟡 Review and retest"}</h2><p>Target shown here is 60%+ as a learning checkpoint; keep training until your score is consistently strong.</p><button class="btn primary" onclick="section('${type}')">Retake</button><button class="btn" onclick="hsk()">HSK Center</button></div>`;return}let q=type=="l"?makeL(Math.floor(n/5)+1):makeR(Math.floor(n/5)+1);app.innerHTML=`<div class="card"><span class="tag">${type=="l"?"🎧 LISTENING":"📖 READING"} · ${n+1}/20</span><h2>${q.title||"Choose the correct answer"}</h2>${type=="l"?`<button class="btn primary" onclick='audio(${JSON.stringify(q.audio)})'>🔊 Play twice</button>`:""}<div class="zh">${q.body||""}</div>${q.opts.map(o=>`<button class="q" onclick='secAns(this,${JSON.stringify(type=="l"?o.text:o)},${JSON.stringify(q.answer)})'>${type=="l"?o.pic+" "+o.text:o}</button>`).join("")}<div id="res"></div></div>`}
window.secAns=function(el,g,c){if(el.dataset.done)return;el.dataset.done=1;let ok=g==c;if(ok)score++;el.classList.add(ok?"good":"bad");setTimeout(next,350)};next()}

function freq(){app.innerHTML=`<div class="card"><span class="tag">EXAM PATTERN ANALYSIS</span><h2>🔥 What to recognize quickly</h2><p>Train patterns, not just isolated words.</p></div>${P.map((p,i)=>`<div class="item"><b>${i+1}. ${p[0]} — ${p[1]}</b><div class="zh">${p[2]}</div><div>${p[3]}</div></div>`).join("")}<div class="card"><h3>High-frequency topic groups</h3><ul><li>Names, age, family, occupation</li><li>Numbers, dates, time and quantities</li><li>Places and movement</li><li>Daily actions: eat, drink, study, work, see, listen</li><li>Yes/no and question-word recognition</li><li>Simple possession, location and descriptions</li></ul></div>`}

let M=[],mi=0,ml=0,mr=0,remaining=35*60,timer;
function mock(){M=[];for(let i=0;i<20;i++)M.push({t:"l",q:makeL(Math.floor(i/5)+1)});for(let i=0;i<20;i++)M.push({t:"r",q:makeR(Math.floor(i/5)+1)});mi=ml=mr=0;remaining=35*60;clearInterval(timer);timer=setInterval(()=>{remaining--;if(remaining<=0){clearInterval(timer);mi=40;showMock()}},1000);showMock()}
function showMock(){if(mi>=40){clearInterval(timer);let ls=Math.round(ml/20*100),rs=Math.round(mr/20*100),total=ls+rs;S.mocks.push({l:ls,r:rs,score:total,date:new Date().toLocaleDateString()});save();app.innerHTML=`<div class="card"><span class="tag">FULL MOCK</span><div class="score">${total}/200</div><h2>${total>=120?"🎉 PASS TARGET":"🟡 NOT YET"}</h2><p>Listening ${ls}/100 · Reading ${rs}/100</p><p>${total>=120?"You reached the official 120/200 threshold.":"Review your weakest section and retest."}</p><button class="btn primary" onclick="mock()">Retake</button></div>`;return}let z=M[mi],q=z.q,mins=Math.floor(remaining/60),secs=String(remaining%60).padStart(2,"0");app.innerHTML=`<div class="card"><span class="tag">${z.t=="l"?"🎧 LISTENING":"📖 READING"} ${mi+1}/40 · ${mins}:${secs}</span><h2>${q.title||"Choose the correct answer"}</h2>${z.t=="l"?`<button class="btn primary" onclick='audio(${JSON.stringify(q.audio)})'>🔊 Play twice</button>`:""}<div class="zh">${q.body||""}</div>${q.opts.map(o=>`<button class="q" onclick='mans(this,${JSON.stringify(z.t=="l"?o.text:o)},${JSON.stringify(q.answer)})'>${z.t=="l"?o.pic+" "+o.text:o}</button>`).join("")}<p class="muted">Exam mode: no Malay pronunciation/Pinyin help. Original questions follow the official HSK 1 structure.</p></div>`}
function mans(el,g,c){if(el.dataset.done)return;el.dataset.done=1;let ok=g==c;if(ok){if(M[mi].t=="l")ml++;else mr++}el.classList.add(ok?"good":"bad");setTimeout(()=>{mi++;showMock()},300)}

function sundell(){app.innerHTML=`<div class="card hero"><span class="tag">WORK TRACK ONLY</span><h2>🏭 SUNDELL PREPARATION</h2><p>Do not mix this with HSK. This track is for real workplace communication.</p></div><div class="grid">
<div class="card"><h3>👋 Self Introduction</h3><p>Name, role and experience.</p><button class="btn primary" onclick="workIntro()">Practice</button></div>
<div class="card"><h3>💬 Daily Conversation</h3><p>Simple communication with colleagues.</p><button class="btn primary" onclick="workConvo()">Practice</button></div>
<div class="card"><h3>🏭 PCB / CQE / PQE</h3><p>Quality, production, lot, defect, spec, root cause and countermeasure.</p><button class="btn primary" onclick="pcb()">Open</button></div>
<div class="card"><h3>🎧 Workplace Listening</h3><p>Factory phrases and instructions.</p><button class="btn primary" onclick="workListen()">Practice</button></div>
<div class="card"><h3>🗣️ Workplace Speaking</h3><p>Hear → repeat → speak.</p><button class="btn primary" onclick="workSpeak()">Practice</button></div>
<div class="card"><h3>🚨 Factory Scenarios</h3><p>Lot issue, OOS, containment, verification, release.</p><button class="btn primary" onclick="factory()">Practice</button></div></div>`}
function workIntro(){app.innerHTML=`<div class="card"><h2>👋 Self Introduction</h2>${D.factory.slice(0,2).map(x=>`<div class="item"><div class="zh">${x.zh}</div><div class="py">${x.py}</div><div class="my">🇲🇾 ${x.my||x.py}</div><div>${x.en}</div><button class="btn" onclick='audio(${JSON.stringify(x.zh)})'>🔊</button></div>`).join("")}</div>`}
function workConvo(){let c=D.convos[Math.floor(Math.random()*D.convos.length)],t=c.turns[0];app.innerHTML=`<div class="card"><h2>💬 ${c.title}</h2><div class="item"><div class="zh">${t.q}</div><div class="py">${t.qpy}</div><div>${t.qen}</div><button class="btn" onclick='audio(${JSON.stringify(t.q)})'>🔊</button></div><div class="item"><div class="zh">${t.a}</div><div class="py">${t.apy}</div><div>${t.aen}</div><button class="btn" onclick='audio(${JSON.stringify(t.a)})'>🔊</button></div><button class="btn primary" onclick="workConvo()">Next</button></div>`}
function workListen(){let x=D.factory[Math.floor(Math.random()*D.factory.length)],o=[x.en,...D.factory.filter(y=>y!=x).sort(()=>Math.random()-.5).slice(0,2).map(y=>y.en)].sort(()=>Math.random()-.5);app.innerHTML=`<div class="card"><h2>🎧 Workplace Listening</h2><button class="btn primary" onclick='audio(${JSON.stringify(x.zh)})'>🔊 Play</button>${o.map(a=>`<button class="q" onclick='wans(this,${JSON.stringify(a)},${JSON.stringify(x.en)})'>${a}</button>`).join("")}<div id="res"></div></div>`}
function wans(el,g,c){if(el.dataset.done)return;el.dataset.done=1;let ok=g==c;el.classList.add(ok?"good":"bad");res.innerHTML=`<h3>${ok?"✅ Correct":"❌ Review"}</h3><button class="btn primary" onclick="workListen()">Next</button>`}
function workSpeak(){let x=D.factory[Math.floor(Math.random()*D.factory.length)];app.innerHTML=`<div class="card"><h2>🗣️ Workplace Speaking</h2><div class="zh">${x.zh}</div><div class="py">${x.py}</div><div class="my">🇲🇾 ${x.my||x.py}</div><div>${x.en}</div><button class="btn primary" onclick='audio(${JSON.stringify(x.zh)})'>🔊 Hear</button><p>Repeat it aloud. If speech recognition is available, use your browser microphone.</p><button class="btn primary" onclick="workSpeak()">Next phrase</button></div>`}
function pcb(){app.innerHTML=`<div class="card"><h2>🏭 PCB / CQE / PQE</h2><input id="pq" placeholder="Search PCB term" oninput="fp()"></div><div id="pl"></div>`;fp()}
function fp(){let q=(pq.value||"").toLowerCase();pl.innerHTML=D.pcb.filter(x=>x.zh.concat(x.py,x.en).toLowerCase().includes(q)).map(x=>`<div class="item"><div class="zh">${x.zh}</div><div class="py">${x.py}</div><div class="my">🇲🇾 ${x.my||x.py}</div><div>${x.en}</div><button class="btn" onclick='audio(${JSON.stringify(x.zh)})'>🔊</button></div>`).join("")}
function factory(){let x=D.factory[Math.floor(Math.random()*D.factory.length)];app.innerHTML=`<div class="card"><h2>🚨 Factory Scenario</h2><p>A quality issue needs communication.</p><div class="item"><div class="zh">${x.zh}</div><div class="py">${x.py}</div><div class="my">🇲🇾 ${x.my||x.py}</div><div>${x.en}</div><button class="btn primary" onclick='audio(${JSON.stringify(x.zh)})'>🔊 Hear</button></div><button class="btn primary" onclick="workSpeak()">Speak it</button></div>`}
function progress(){let x=S.mocks.at(-1);app.innerHTML=`<div class="card"><h2>📊 Progress</h2><p>HSK vocabulary: ${Object.keys(S.master).length}/150</p><p>Listening section tests: ${S.mini.l.length} · Reading: ${S.mini.r.length}</p><p>Latest mock: ${x?x.score+"/200":"not completed"}</p></div>`}
render();
</script></body></html>
